[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonem-transcriptor"
version = "0.1.0"
description = "Audio in, phonemes with timestamps out."
requires-python = ">=3.11,<3.12"
dependencies = [
    "einops==0.6.1",
    "faster-whisper>=1.1.0",
    "g2pk",
    "jamo",
    "librosa==0.9.2",
    "lightning>=2.2,<2.5",
    "matplotlib",
    "mido>=1.3.0",
    "numba",
    "numpy>=1.24,<2",
    "pandas",
    "pydantic>=2.11,<3",
    "pypinyin",
    "PyYAML",
    "setuptools>=69,<81",
    "soundfile",
    "textgrid",
    "tqdm",
    "uroman",
]

[project.scripts]
phonem-transcriptor = "phonem_transcriptor.cli:main"

[tool.setuptools.packages.find]
include = ["phonem_transcriptor*"]
